services:
  app:
    profiles: ['app']
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-issun}:${POSTGRES_PASSWORD:-issun}@db:5432/${POSTGRES_DB:-issun}
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-issun}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-issun}
      POSTGRES_DB: ${POSTGRES_DB:-issun}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-issun} -d ${POSTGRES_DB:-issun}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  app_node_modules:
